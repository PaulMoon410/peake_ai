<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PeakeCoin Liar's Poker</title>
    <link href="casino-theme.css" rel="stylesheet">
    <script src="../session.js"></script>
    <script src="../betting_logic.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const saved = getLoggedInUser();
            if (saved && document.getElementById('playerName')) {
                document.getElementById('playerName').value = saved;
            }
        });
    </script>
</head>
<body>
<div id="main-content" style="display:none;">
    <div class="game-container">
        <div class="game-title">PeakeCoin Liar's Poker</div>
        <div id="liarspoker-table">
            <div id="liarspoker-hand" class="hand"></div>
            <label for="liarspoker-guess">Your Guess:</label>
            <input type="text" id="liarspoker-guess" placeholder="e.g. Pair, Straight, Flush">
        </div>
        <div id="bet-section" style="margin:16px 0;">
            <input type="number" id="bet-amount" min="0.000001" step="0.000001" placeholder="Bet Amount (PEK)" style="width:160px;">
            <button id="place-bet-btn" class="game-btn" style="width:auto;">Place Bet</button>
            <span id="bet-status" style="margin-left:12px;color:#ffd700;"></span>
        </div>
        <div id="controls">
            <button id="liarspoker-deal" class="game-btn" disabled>Deal</button>
        </div>
        <div id="liarspoker-result" class="game-messages"></div>
        <div id="wallet-section" class="balance-display" style="margin-top:18px;">
            <span id="wallet-address"></span>
            <span id="wallet-balance"></span>
        </div>
    </div>
</div>
<script src="./liarspoker.js"></script>
</body>
</html>

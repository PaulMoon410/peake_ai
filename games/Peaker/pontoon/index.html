<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PeakeCoin Pontoon</title>
    <link href="casino-theme.css" rel="stylesheet">
    <script src="../session.js"></script>
    <script src="../betting_logic.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const saved = getLoggedInUser();
            if (saved && document.getElementById('playerName')) {
                document.getElementById('playerName').value = saved;
            }
        });
    </script>
</head>
<body>
<div id="main-content" style="display:none;">
    <div class="game-container">
        <div class="game-title">PeakeCoin Pontoon</div>
        <div id="pontoon-table">
            <label for="pontoon-bet">Bet Amount (PEK):</label>
            <input type="number" id="pontoon-bet" min="0.000001" value="0.000001">
            <div><b>Your Hand:</b></div>
            <div class="hand" id="pontoon-player-cards"></div>
            <div><b>Dealer's Hand:</b></div>
            <div class="hand" id="pontoon-dealer-cards"></div>
        </div>
        <div id="controls">
            <button id="pontoon-deal" class="game-btn">Deal</button>
            <button id="pontoon-twist" class="game-btn">Twist</button>
            <button id="pontoon-stick" class="game-btn">Stick</button>
            <button id="pontoon-buy" class="game-btn">Buy</button>
        </div>
        <div id="bet-section" style="margin:16px 0;">
            <input type="number" id="bet-amount" min="0.000001" step="0.000001" placeholder="Bet Amount (PEK)" style="width:160px;">
            <button id="place-bet-btn" class="game-btn" style="width:auto;">Place Bet</button>
            <span id="bet-status" style="margin-left:12px;color:#ffd700;"></span>
        </div>
        <div id="pontoon-result" class="game-messages"></div>
        <div id="wallet-section" class="balance-display" style="margin-top:18px;">
            <span id="wallet-address"></span>
            <span id="wallet-balance"></span>
        </div>
    </div>
</div>
<script src="./pontoon.js"></script>
</body>
</html>
